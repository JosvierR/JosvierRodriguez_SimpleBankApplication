spring.application.name=simple-bank
server.port=${PORT:8080}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} env=${SPRING_PROFILES_ACTIVE:local} revision=${app.revision} - %msg%n
app.revision=${APP_REVISION:${RENDER_GIT_COMMIT:local}}

# Clients should receive the ErrorResponse body, never a Java stack trace.
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Connection string comes from the environment. Do not put a real URI here.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:simple_bank}

# Spring Data does not create annotated indexes unless this is turned on.
spring.data.mongodb.auto-index-creation=true

# Money stays BigDecimal in Java and BSON Decimal128 in Atlas, never a double.
spring.data.mongodb.representation.big-decimal=decimal128

# HMAC key for access tokens. No default: a missing JWT_SECRET must stop startup.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Metrics stay on a private management port. The public API does not serve /actuator.
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.heapdump.enabled=false
management.info.env.enabled=false

# Explicit, disabled-by-default promotion of an existing login. Disable again
# immediately after the first successful bootstrap.
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}

# Exact browser origins for a split Vercel deployment. Empty keeps same-origin proxying.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Demo seeding stays off unless the demo profile is active and this flag is true.
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.reset=${DEMO_SEED_RESET:false}
demo.seed.credentials-file=${DEMO_CREDENTIALS_FILE:docs/demo-credentials.txt}
