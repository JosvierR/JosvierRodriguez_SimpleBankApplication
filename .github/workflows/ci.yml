name: CI

on:
  pull_request:
    branches:
      - ReactFrontend-BankApp-Making-RestCall-To-Backend
      - devops/platform-automation
      - staging
      - deploy/vercel-production
  push:
    branches:
      - ReactFrontend-BankApp-Making-RestCall-To-Backend
      - devops/platform-automation
      - staging
      - deploy/vercel-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw -B -ntp clean test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check translations
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t simple-bank-backend-ci .

      - name: Build frontend image
        run: docker build -t simple-bank-frontend-ci ./frontend

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format and validate
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/environments/staging init -backend=false
          terraform -chdir=infra/terraform/environments/staging validate
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and list tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --list

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Scan tracked files
        run: node scripts/secret-scan.mjs

  required:
    name: Required CI
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
      - terraform
      - playwright
      - secrets
    if: ${{ !cancelled() }}
    steps:
      - name: Require every quality gate
        run: |
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          docker="${{ needs.docker.result }}"
          terraform="${{ needs.terraform.result }}"
          playwright="${{ needs.playwright.result }}"
          secrets="${{ needs.secrets.result }}"
          echo "backend=${backend}"
          echo "frontend=${frontend}"
          echo "docker=${docker}"
          echo "terraform=${terraform}"
          echo "playwright=${playwright}"
          echo "secrets=${secrets}"
          if [ "$backend" != "success" ] || [ "$frontend" != "success" ] || [ "$docker" != "success" ] || [ "$terraform" != "success" ] || [ "$playwright" != "success" ] || [ "$secrets" != "success" ]; then
            echo "Required CI failed"
            exit 1
          fi
