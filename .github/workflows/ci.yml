name: CI

on:
  pull_request:
    branches:
      - ReactFrontend-BankApp-Making-RestCall-To-Backend
      - staging
      - deploy/vercel-production
  push:
    branches:
      - ReactFrontend-BankApp-Making-RestCall-To-Backend
      - staging
      - deploy/vercel-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw -B -ntp clean test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check translations
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t simple-bank-backend-ci .

      - name: Build frontend image
        run: docker build -t simple-bank-frontend-ci ./frontend

  required:
    name: Required CI
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: ${{ !cancelled() }}
    steps:
      - name: Require backend, frontend, and Docker
        run: |
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          docker="${{ needs.docker.result }}"
          echo "backend=${backend}"
          echo "frontend=${frontend}"
          echo "docker=${docker}"
          if [ "$backend" != "success" ] || [ "$frontend" != "success" ] || [ "$docker" != "success" ]; then
            echo "Required CI failed"
            exit 1
          fi
