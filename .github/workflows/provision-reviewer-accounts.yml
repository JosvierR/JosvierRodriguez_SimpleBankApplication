name: Provision production reviewer accounts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Create reviewer roster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Provision synthetic reviewer accounts
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.PRODUCTION_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
        run: node scripts/provision-production-reviewers.mjs
