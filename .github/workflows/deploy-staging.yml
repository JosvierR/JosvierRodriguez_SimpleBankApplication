name: Staging Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require staging ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/staging" ]; then
            echo "Staging deploys must run from refs/heads/staging; got ${GITHUB_REF}"
            exit 1
          fi

      - name: Resolve exact deploy SHA
        id: sha
        run: |
          deploy_sha="${GITHUB_SHA}"
          if ! printf '%s' "$deploy_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Deploy SHA is not a 40-character commit id"
            exit 1
          fi
          echo "sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "Waiting for staging CI on ${deploy_sha}"

      - name: Wait for successful CI on this staging SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=staging&head_sha=${DEPLOY_SHA}&per_page=10")
            count=$(printf '%s' "$json" | jq '.workflow_runs | length')
            if [ "$count" -eq 0 ]; then
              echo "CI run not visible yet for ${DEPLOY_SHA}; waiting"
              sleep 15
              continue
            fi

            status=$(printf '%s' "$json" | jq -r '.workflow_runs[0].status // "unknown"')
            conclusion=$(printf '%s' "$json" | jq -r '.workflow_runs[0].conclusion // ""')
            run_url=$(printf '%s' "$json" | jq -r '.workflow_runs[0].html_url // ""')
            echo "CI status=${status} conclusion=${conclusion} ${run_url}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "Staging CI completed without success"
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for successful staging CI"
          exit 1

  deploy:
    name: Deploy staging
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: ${{ vars.STAGING_FRONTEND_URL }}
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
    steps:
      - name: Require staging configuration
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_RECIPIENT_ACCOUNT_NUMBER: ${{ vars.STAGING_RECIPIENT_ACCOUNT_NUMBER }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
          STAGING_CUSTOMER_USERNAME: ${{ secrets.STAGING_CUSTOMER_USERNAME }}
          STAGING_CUSTOMER_PASSWORD: ${{ secrets.STAGING_CUSTOMER_PASSWORD }}
          STAGING_ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          missing=0
          for name in \
            STAGING_API_BASE_URL \
            STAGING_FRONTEND_URL \
            STAGING_RECIPIENT_ACCOUNT_NUMBER \
            VERCEL_TOKEN \
            RENDER_STAGING_DEPLOY_HOOK_URL \
            STAGING_CUSTOMER_USERNAME \
            STAGING_CUSTOMER_PASSWORD \
            STAGING_ADMIN_USERNAME \
            STAGING_ADMIN_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "Missing staging setting: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Confirm CI succeeded for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=staging&head_sha=${DEPLOY_SHA}&status=success&per_page=5" --jq "[.workflow_runs[] | select(.head_sha==\"${DEPLOY_SHA}\" and .head_branch==\"staging\" and .conclusion==\"success\")] | length")
          echo "Successful staging CI runs for ${DEPLOY_SHA}: ${count}"
          if [ "${count}" -lt 1 ]; then
            echo "Refusing to deploy a SHA without successful staging CI"
            exit 1
          fi

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Request Render deploy of exact SHA
        env:
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          hook="${RENDER_STAGING_DEPLOY_HOOK_URL}"
          case "$hook" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST "${hook}${separator}ref=${DEPLOY_SHA}" || true)
          echo "Render deploy hook HTTP ${code}"
          case "$code" in
            200|201|202) ;;
            *) echo "Render deploy request failed"; exit 1 ;;
          esac

      - name: Wait for backend readiness
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          api="${STAGING_API_BASE_URL%/}"
          deadline=$((SECONDS + 900))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(mktemp)
            code=$(curl --silent --output "$body" --write-out "%{http_code}" "${api}/public/ready" || true)
            status=$(jq -r '.status // empty' "$body" 2>/dev/null || true)
            environment=$(jq -r '.environment // empty' "$body" 2>/dev/null || true)
            revision=$(jq -r '.revision // empty' "$body" 2>/dev/null || true)
            rm -f "$body"
            echo "ready HTTP ${code} status=${status} environment=${environment} revision=${revision}"
            if [ "$code" = "200" ] && [ "$status" = "UP" ] && [ "$environment" = "staging" ] && [ "$revision" = "$DEPLOY_SHA" ]; then
              ready=1
              break
            fi
            sleep 20
          done
          if [ "$ready" != "1" ]; then
            echo "Backend readiness did not match ${DEPLOY_SHA}"
            exit 1
          fi

      - name: Deploy Vercel staging project
        env:
          VERCEL_ORG_ID: team_JKrJa4sOTaNooio7czIdnEks
          VERCEL_PROJECT_ID: prj_hEwtdSNKmahdU5kKrcghZGsCwLoG
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel frontend/.vercel
          npm install --global vercel@58.9.1
          npm ci --prefix frontend
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-deploy-url.txt"
          echo "Vercel staging deployment finished"

      - name: Run staging smoke and acceptance
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_RECIPIENT_ACCOUNT_NUMBER: ${{ vars.STAGING_RECIPIENT_ACCOUNT_NUMBER }}
          STAGING_CUSTOMER_USERNAME: ${{ secrets.STAGING_CUSTOMER_USERNAME }}
          STAGING_CUSTOMER_PASSWORD: ${{ secrets.STAGING_CUSTOMER_PASSWORD }}
          STAGING_ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          EXPECTED_REVISION: ${{ needs.gate.outputs.deploy_sha }}
          EXPECTED_ENVIRONMENT: staging
          REQUIRE_ADMIN: "true"
        run: node scripts/staging-smoke.mjs

      - name: Run staging Playwright
        env:
          E2E_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          E2E_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          E2E_CUSTOMER_USERNAME: ${{ secrets.STAGING_CUSTOMER_USERNAME }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.STAGING_CUSTOMER_PASSWORD }}
          E2E_ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          E2E_EXPECTED_REVISION: ${{ needs.gate.outputs.deploy_sha }}
          E2E_EXPECTED_ENVIRONMENT: staging
          E2E_REQUIRE_AUTH: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:staging

      - name: Record staging deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state="success"
            description="Staging deploy succeeded"
          else
            state="failure"
            description="Staging deploy failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -f state="$state" \
            -f context="staging/deploy" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$state" != "success" ]; then
            exit 1
          fi
